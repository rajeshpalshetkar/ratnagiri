name: Ratnagiri Android App Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and release AAB
        working-directory: android_studio/BloggerNewsApp
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ratnagiri-debug-apk
          path: android_studio/BloggerNewsApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ratnagiri-release-aab-unsigned
          path: android_studio/BloggerNewsApp/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
